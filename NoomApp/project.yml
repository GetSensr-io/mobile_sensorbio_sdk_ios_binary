name: NoomApp
options:
  bundleIdPrefix: ai.sensr.example
  createIntermediateGroups: true
  postGenCommand: pod install && python3 scripts/configure_generated_scheme.py
  deploymentTarget:
    iOS: "18.0"
  generateEmptyDirectories: true

# Reference SwiftUI integration of SensorBioSDK consumed as a binary
# CocoaPod from ../SensorBio/SensorBioSDK.podspec. Demonstrates the
# init pattern + sign-in flow on a real device.
#
# After cloning, run:
#   xcodegen generate  # also installs Pods and restores explicit build ordering
#   open NoomApp.xcworkspace

settings:
  base:
    # Use Swift 5 language mode for the example app. Swift 6 region-based
    # concurrency flags `sending` warnings against the SDKExample's watchdog
    # closures even at minimal strict-concurrency. Treating the example as a
    # customer-style integration target rather than a strict-Swift-6 showcase
    # — the SDK itself is Swift 6, customers can pick their own mode.
    SWIFT_VERSION: "5"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    # Required for transitive abseil (pulled in by gRPC-Core) — static-asserts
    # __cplusplus >= 201703L on every translation unit.
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
    # FXCBridge's fx_datatypes.h (inside SensorBioSDK.xcframework's Headers/)
    # `#error`s without one of FX_PLATFORM_{WIN32, UNIX, ARM_M3, ARM_M4,
    # MSP430}. The SensorBio podspec sets this via user_target_xcconfig too;
    # we also set it here so xcodegen-generated configs match before pod install.
    GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) FX_PLATFORM_UNIX=1"
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

targets:
  NoomApp:
    type: application
    platform: iOS
    sources:
      - NoomApp
    info:
      path: NoomApp/Info.plist
      properties:
        CFBundleIconName: AppIcon
        CFBundleDisplayName: Noom+
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "28"
        ITSAppUsesNonExemptEncryption: false
        ProductLoopEndpoint: https://stoic-mink-37.convex.site
        # BLE permission strings — the SDK pairs over CoreBluetooth.
        NSBluetoothAlwaysUsageDescription: Noom+ uses Bluetooth to connect to your Noom Band.
        NSBluetoothPeripheralUsageDescription: Noom+ uses Bluetooth to connect to your Noom Band.
        # Background mode required for the SDK to finish syncs after the app is backgrounded.
        UIBackgroundModes:
          - bluetooth-central
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.sensr.example.NoomApp
        INFOPLIST_FILE: NoomApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Real device build needs signing — your team ID. The committed value
        # is the Noom dev team; override locally if you're building this
        # under a different Apple Developer account.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2V6RCD4SM4

  NoomAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - NoomAppTests
    dependencies:
      - target: NoomApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.sensr.example.NoomAppTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  NoomApp:
    build:
      targets:
        NoomApp: all
        NoomAppTests: [test]
    test:
      targets:
        - NoomAppTests
