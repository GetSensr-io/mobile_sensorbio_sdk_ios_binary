name: ExampleApp
options:
  bundleIdPrefix: ai.sensr.example
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
  generateEmptyDirectories: true

# Reference SwiftUI integration of SensorBioSDK, consumed as a Swift Package
# from the repo one level up. Demonstrates the init pattern + sign-in flow on
# a real device.
#
# `path: ..` is correct in BOTH repos and needs no per-repo flavouring: in the
# SDK source repo it resolves to the source package, and in the customer-facing
# binary repo to the xcframework distribution. Both vend a `SensorBioSDK`
# product, so this file is genuinely shared verbatim now — the two Podfiles it
# used to need are gone.
#
# Note what is NOT here: no grpc-swift, no SwiftProtobuf, no keychain library.
# A customer declares the SDK and nothing else; everything it uses is compiled
# inside the xcframework with its symbols hidden. This app is the proof of that
# claim, so do not add dependencies here to make something link.
#
# After cloning, run:
#   xcodegen generate
#   open ExampleApp.xcodeproj

packages:
  SensorBioSDK:
    path: ..

settings:
  base:
    # Use Swift 5 language mode for the example app. Swift 6 region-based
    # concurrency flags `sending` warnings against the SDKExample's watchdog
    # closures even at minimal strict-concurrency. Treating the example as a
    # customer-style integration target rather than a strict-Swift-6 showcase
    # — the SDK itself is Swift 6, customers can pick their own mode.
    SWIFT_VERSION: "5"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    # FXCBridge's fx_datatypes.h (inside SensorBioSDK.xcframework's Headers/)
    # `#error`s without one of FX_PLATFORM_{WIN32, UNIX, ARM_M3, ARM_M4,
    # MSP430}.
    GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) FX_PLATFORM_UNIX=1"

targets:
  ExampleApp:
    type: application
    platform: iOS
    sources:
      - ExampleApp
    dependencies:
      - package: SensorBioSDK
        product: SensorBioSDK
    info:
      path: ExampleApp/Info.plist
      properties:
        # BLE permission strings — the SDK pairs over CoreBluetooth.
        NSBluetoothAlwaysUsageDescription: ExampleApp uses Bluetooth to connect to your Sensr-Bio wearable.
        NSBluetoothPeripheralUsageDescription: ExampleApp uses Bluetooth to connect to your Sensr-Bio wearable.
        # Background mode required for the SDK to finish syncs after the app is backgrounded.
        UIBackgroundModes:
          - bluetooth-central
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.sensr.example.ExampleApp
        INFOPLIST_FILE: ExampleApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Real device build needs signing — your team ID. The committed value
        # is the Sensr-Bio dev team; override locally if you're building this
        # under a different Apple Developer account.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2V6RCD4SM4
