name: Security

# NOTE (GitHub Team): publishing results to the GitHub Security tab via SARIF
# upload requires GitHub Advanced Security (Enterprise); we are on Team, so the
# upload steps below are commented out. Every scanner still RUNS and prints its
# findings to this job's log. To enable the Security tab later: upgrade to
# Enterprise + Advanced Security and uncomment the upload-sarif steps.

on:
  pull_request:
    branches: [main, master, develop, development, production, sensr_develop]
  push:
    branches: [main, master, develop, development, production, sensr_develop]
  schedule:
    - cron: '17 6 * * 1'  # weekly Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (secret scanning)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          ver=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_arm64.tar.gz" | tar -xz gitleaks
          ./gitleaks dir . --redact --no-banner --exit-code 1

  swiftlint:
    name: SwiftLint (security + lint rules)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - run: |
          brew install swiftlint || true
          swiftlint --reporter github-actions-logging || true
